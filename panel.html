<link rel="stylesheet" href="panel.css" />

<div id="controls">
  <button id="capture">Start capturing</button>
  <button id="export">Export JSON</button>
  <button id="clear">Clear</button>
</div>

<div id="tabs" class="filter-bar">
  <button class="filter-btn active" data-tab="duplicates-tab">Duplicates</button>
  <button class="filter-btn" data-tab="friends-tab">Friends</button>
  <button class="filter-btn" data-tab="new-friends-tab">Search new friends</button>
  <button class="filter-btn" data-tab="stats-tab">Stats</button>
  <button class="filter-btn" data-tab="raids-tab">Raids</button>
</div>

<div id="duplicates-tab" class="tab">
  <div id="attribute-filter" class="filter-bar"></div>
  <div id="summon-duplicates-section" class="section"></div>
  <div id="weapon-duplicates-section" class="section"></div>
</div>
<div id="friends-tab" class="tab" hidden>
  <div id="friends-section" class="section"></div>
</div>
<div id="new-friends-tab" class="tab" hidden>
  <div id="non-friends-section" class="section"></div>
</div>
<div id="stats-tab" class="tab" hidden>
  <div id="stats-section" class="section"></div>
</div>

<div id="raids-tab" class="tab" hidden>
  <div class="raids-columns">
    <div class="section">
      <h3>Backup requests</h3>
      <div class="section-controls"><button id="clear-raids">Clear raids</button></div>
      <div id="assist-section"></div>
    </div>
    <div id="current-raid-section" class="section"></div>
  </div>
</div>

<script type="module" src="panel.js"></script>
